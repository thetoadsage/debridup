services:
  debridup:
    image: ghcr.io/thetoadsage/debridup:${DEBRIDUP_IMAGE_TAG:-latest}
    ports:
      - "8080:8080"
    environment:
      DEBRIDUP_ADMIN_PASSWORD: ${DEBRIDUP_ADMIN_PASSWORD:?set in .env}
      DEBRIDUP_ENCRYPTION_KEY_FILE: /run/secrets/encryption_key
    volumes:
      - debridup-data:/data
    secrets:
      - encryption_key
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    restart: unless-stopped

secrets:
  encryption_key:
    # Keep this host file root:root mode 0400 as documented in README.md.
    file: ./secrets/encryption_key

volumes:
  debridup-data:
