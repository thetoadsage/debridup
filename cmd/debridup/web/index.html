<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DebridUp</title><link rel="stylesheet" href="/app.css"><link rel="stylesheet" href="/chart.css"></head>
<body><header><a class="brand" href="/"><span class="mark">D</span>DebridUp</a><nav><button id="refresh" class="quiet">Refresh</button><button id="logout" class="quiet">Sign out</button></nav></header>
<main><section class="hero"><div><p class="eyebrow">PRIVATE MONITORING</p><h1>Provider status</h1><p id="updated" class="muted">Loading…</p></div><button id="add-monitor">Add provider</button></section><section id="cards" class="cards"></section>
<section class="panel"><div class="section-title"><div><p class="eyebrow">30 DAYS</p><h2>Availability comparison</h2></div></div><div id="comparison" class="comparison"></div></section>
<section class="split"><section class="panel"><div class="section-title"><h2>Recent incidents</h2></div><div id="incidents" class="list"></div></section><section class="panel"><div class="section-title"><h2>Notifications</h2></div><form id="ntfy-form" class="form compact"><label>ntfy topic URL<input id="ntfy-url" type="url" placeholder="https://ntfy.example/topic"></label><label class="check"><input id="ntfy-enabled" type="checkbox"> Enable ntfy notifications</label><button>Save notification settings</button><p id="ntfy-status" class="muted"></p></form></section></section></main>
<dialog id="monitor-dialog"><form id="monitor-form" class="form"><div class="dialog-head"><h2>Add provider</h2><button type="button" class="quiet" id="close-dialog">×</button></div><label>Provider<select id="provider"><option value="torbox">TorBox</option><option value="premiumize">Premiumize</option></select></label><label>Display name<input id="name" required maxlength="80" placeholder="TorBox"></label><label>API key<input id="api-key" type="password" required autocomplete="off"></label><div class="two"><label>Interval (seconds)<input id="interval" type="number" min="15" max="3600" value="60" required></label><label>Timeout (seconds)<input id="timeout" type="number" min="3" max="60" value="15" required></label><label>Failure confirmations<input id="failure" type="number" min="1" max="20" value="3" required></label><label>Recovery confirmations<input id="recovery" type="number" min="1" max="20" value="2" required></label></div><label class="check"><input id="public-check" type="checkbox"> Check official public status page</label><p id="monitor-error" class="error"></p><button>Save and test</button></form></dialog><script src="/app.js"></script></body></html>
